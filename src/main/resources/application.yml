server:
  port: 8085
spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://postgres.finpay-infra.svc.cluster.local:5432/finpay_notification
    username: finpay
    password: finpay
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: kafka.finpay-infra.svc.cluster.local:9092
    consumer:
      group-id: notification-consumer

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      service: notification-service

finpay:
  notification:
    topics:
      requested: finpay.notification
      dead-letter: finpay.notification.dlq
    llm:
      byok-secret-ref: ai-key
      timeout-seconds: 15
